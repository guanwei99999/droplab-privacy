<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop Lab Privacy Policy</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --text: #e0e0e0;
      --muted: #999;
      --accent: #ff6b35;
      --border: #333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.7;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: var(--accent); margin-bottom: 8px; font-size: 28px; }
    h2 { color: var(--accent); margin: 24px 0 12px; font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    h3 { color: #fff; margin: 16px 0 8px; font-size: 15px; }
    p { margin-bottom: 12px; color: #ccc; }
    ul { margin-left: 20px; margin-bottom: 12px; }
    li { margin-bottom: 6px; color: #bbb; }
    .last-updated { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { background: #1a1a1a; padding: 2px 6px; border-radius: 4px; font-size: 13px; }

    /* Language selector */
    .lang-selector {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
    }
    .lang-selector select {
      background: #1a1a1a;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      outline: none;
    }
    .lang-selector select:hover {
      border-color: var(--accent);
    }
  </style>
</head>
<body>

<!-- Language selector -->
<div class="lang-selector">
  <select id="langSelect" onchange="switchLang(this.value)">
    <option value="en">English</option>
    <option value="zh">中文</option>
    <option value="ja">日本語</option>
  </select>
</div>

function switchLang(lang) {
  const t = i18n[lang] || i18n['en'];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang === 'ja' ? 'ja' : 'en';
  document.title = t.title;

  let html = `
    <h1>${t.title}</h1>
    <p class="last-updated">${t.lastUpdated}</p>
    <p>${t.intro}</p>

    <h2>${t.section1}</h2>
    <h3>${t.sub1_1}</h3>
    <p>${t.localData}</p>
    <ul>${t.listLocal.map(i => `<li>${i}</li>`).join('')}</ul>

    <h3>${t.sub1_2}</h3>
    <p>${t.networkData}</p>
    <ul>${t.listNetwork.map(i => `<li>${i}</li>`).join('')}</ul>
    <p>${t.networkPurpose}</p>

    <h2>${t.section2}</h2>
    <ul>${t.purposeList.map(i => `<li>${i}</li>`).join('')}</ul>

    <h2>${t.section3}</h2>
    <ul>${t.storageList.map(i => `<li>${i}</li>`).join('')}</ul>

    <h2>${t.section4}</h2>
    <p>${t.sharingText}</p>
    <ul>${t.sharingList.map(i => `<li>${i}</li>`).join('')}</ul>
    <p>${t.exception}</p>

    <h2>${t.section5}</h2>
    <ul>${t.rightsList.map(i => `<li>${i}</li>`).join('')}</ul>

    <h2>${t.section6}</h2>
    <p>${t.thirdPartyIntro}</p>
    <ul>${t.thirdPartyList.map(i => `<li>${i}</li>`).join('')}</ul>

    <h2>${t.section7}</h2>
    <p>${t.childrenText}</p>

    <h2>${t.section8}</h2>
    <p>${t.updatesText}</p>

    <h2>${t.section9}</h2>
    <p>${t.contactIntro}</p>
    <ul>
      <li>${t.contactEmail}</li>
      <li><a href="https://github.com/guanwei99999/dropLab" target="_blank">github.com/guanwei99999/dropLab</a></li>
    </ul>

    <hr style="border-color: var(--border); margin: 32px 0;">
    <p style="text-align: center; color: var(--muted); font-size: 12px;">${t.footer}</p>
  `;

  document.getElementById('content').innerHTML = html;
  localStorage.setItem('privacy_lang', lang);
}

// Initialize: detect saved preference or browser language
(function init() {
  const saved = localStorage.getItem('privacy_lang');
  const browser = navigator.language.slice(0, 2);
  const defaultLang = (saved && i18n[saved]) ? saved : (i18n[browser] ? browser : 'en');

  document.getElementById('langSelect').value = defaultLang;
  switchLang(defaultLang);
})();
</script>
